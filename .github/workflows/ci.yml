name: CI

# Runs lint/typecheck/test/build for all three independently-versioned
# pnpm projects (database, backend, frontend — see CLAUDE.md: this is not
# a single pnpm workspace, each has its own lockfile and is linked to the
# others via "file:" dependencies), plus a Playwright e2e job against the
# built apps. Mirrors `pnpm lint && pnpm typecheck && pnpm test && pnpm build`
# run by hand in each project (see CLAUDE.md "Commands").

on:
  pull_request:
  push:
    branches: [main, master]

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  JWT_ACCESS_SECRET: test-access-secret
  JWT_REFRESH_SECRET: test-refresh-secret
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  CORS_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
  PORT: 3001

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: database — install + generate Prisma client + migrate
        working-directory: database
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm migrate:deploy

      # backend's install also builds @study-planner/shared (its "prepare" script).
      - name: backend — install
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: frontend — install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: backend — lint
        working-directory: backend
        run: pnpm lint
      - name: backend — typecheck
        working-directory: backend
        run: pnpm typecheck
      - name: backend — test (coverage)
        working-directory: backend
        run: pnpm test:cov
      - name: backend — build
        working-directory: backend
        run: pnpm build

      - name: frontend — lint
        working-directory: frontend
        run: pnpm lint
      - name: frontend — typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: frontend — test (coverage)
        working-directory: frontend
        run: pnpm test:cov
      - name: frontend — build
        working-directory: frontend
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: database — install + generate Prisma client + migrate
        working-directory: database
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm migrate:deploy

      - name: backend — install + build
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: frontend — install + build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup node dist/main.js > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup pnpm start > /tmp/frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          npx wait-on -t 30000 http://localhost:3001/api/v1/health http://localhost:3000

      # - name: Run Playwright e2e suite
      #   working-directory: frontend
      #   run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
